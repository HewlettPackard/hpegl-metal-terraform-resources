#(C) Copyright 2022, 2025, 2026 Hewlett Packard Enterprise Development LP

version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - godot
    - goheader
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - nestif
    - nlreturn
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unused
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    dupl:
      threshold: 110
    exhaustive:
      default-signifies-exhaustive: true
    goheader:
      values:
        regexp:
          copy: ^\(C\) Copyright {{ range }} Hewlett Packard Enterprise Development LP$
          range: (([0-9]{4}(,\s?|-))*{{ year }})
      template: '{{ copy }}'
    lll:
      line-length: 128
      tab-width: 1
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 1
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - docs
      - build
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - Standard
        - Default
        - prefix(github.com/hewlettpackard)
    goimports:
      local-prefixes:
        - github.com/hewlettpackard
  exclusions:
    generated: lax
    paths:
      - vendor
      - docs
      - build
      - third_party$
      - builtin$
      - examples$
